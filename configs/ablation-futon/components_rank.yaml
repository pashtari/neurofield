# FUTON ablation on the image task: components against CP rank, both set
# from the image. The components per axis are a fraction alpha of the pixels,
# K = (alpha H, alpha W), and the rank a fraction beta of the smaller count,
# R = beta min(K_1, K_2), both over {1/8, 1/4, 1/2, 1, 2}, for the lanczos and
# sinc bases and the benchmark's one-layer MLP decoder. Model names carry alpha
# and beta as decimals: FUTON-sinc-a0.5-b1 has K = (H / 2, W / 2) and R = H / 2.
#     python scripts/train_image.py --config configs/ablation-futon/components_rank.yaml
# The data and training settings repeat configs/image.yaml.

data:
  subsample: 0.1

train:
  num_epochs: 2000
  log_interval: 100
  eval_interval: 100
  seed: 0

models:
  FUTON-lanczos-a0.125-b0.125:
    class: FUTON
    kwargs:
      basis: [lanczos, {num_components: [H // 8, W // 8], radius: 3}]
      combiner: [cp, {rank: "min(H, W) // 64"}]
      decoder: [mlp, {hidden_layers: 1}]
      output_activation: tanh
    train: {lr: 3.0e-2}

  FUTON-lanczos-a0.125-b0.25:
    class: FUTON
    kwargs:
      basis: [lanczos, {num_components: [H // 8, W // 8], radius: 3}]
      combiner: [cp, {rank: "min(H, W) // 32"}]
      decoder: [mlp, {hidden_layers: 1}]
      output_activation: tanh
    train: {lr: 3.0e-2}

  FUTON-lanczos-a0.125-b0.5:
    class: FUTON
    kwargs:
      basis: [lanczos, {num_components: [H // 8, W // 8], radius: 3}]
      combiner: [cp, {rank: "min(H, W) // 16"}]
      decoder: [mlp, {hidden_layers: 1}]
      output_activation: tanh
    train: {lr: 3.0e-2}

  FUTON-lanczos-a0.125-b1:
