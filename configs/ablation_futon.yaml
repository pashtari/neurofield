# FUTON ablations on the occupancy task:
#     scripts/train_occupancy.py --config configs/ablation_futon.yaml \
#         --log-dir logs/ablation-futon
# The settings repeat configs/occupancy.yaml, and the reference model is
# K=256 components, CP rank 144 and a one-layer MLP decoder (131,617 parameters).

data:
  resolution: 256
  subsample: 0.01

train:
  num_epochs: 2000
  log_interval: 100
  eval_interval: 100
  chunk_size: 262144
  seed: 0

models:
  # Bases, at the reference size.
  FUTON-cosine:
    class: FUTON
    kwargs:
      basis: [cosine, {num_components: 256, grid_size: 256}]
      combiner: [cp, {rank: 144}]
      decoder: [mlp, {hidden_layers: 1}]
      output_activation: tanh
    train: {lr: 1.0e-2}

  FUTON-lanczos:
    class: FUTON
    kwargs:
      basis: [lanczos, {num_components: 256, radius: 3}]
      combiner: [cp, {rank: 144}]
      decoder: [mlp, {hidden_layers: 1}]
      output_activation: tanh
    train: {lr: 1.0e-2}

  FUTON-sinc:
    class: FUTON
    kwargs:
      basis: [sinc, {num_components: 256, grid_size: 256}]
      combiner: [cp, {rank: 144}]
      decoder: [mlp, {hidden_layers: 1}]
      output_activation: tanh
    train: {lr: 1.0e-2}

  FUTON-triangle:
    class: FUTON
    kwargs:
      basis: [triangle, {num_components: 256}]
      combiner: [cp, {rank: 144}]
      decoder: [mlp, {hidden_layers: 1}]
      output_activation: tanh
    train: {lr: 1.0e-2}

  FUTON-chebyshev:
    class: FUTON
    kwargs:
      basis: [chebyshev, {num_components: 256}]
      combiner: [cp, {rank: 144}]
      decoder: [mlp, {hidden_layers: 1}]
      output_activation: tanh
    train: {lr: 1.0e-2}

  FUTON-legendre:
    class: FUTON
    kwargs:
      basis: [legendre, {num_components: 256}]
      combiner: [cp, {rank: 144}]
      decoder: [mlp, {hidden_layers: 1}]
      output_activation: tanh
    train: {lr: 1.0e-2}

  # Components K against rank R.
  FUTON-cosine-K64-R64:
    class: FUTON
    kwargs:
      basis: [cosine, {num_components: 64, grid_size: 256}]
      combiner: [cp, {rank: 64}]
      decoder: [mlp, {hidden_layers: 1}]
      output_activation: tanh
    train: {lr: 1.0e-2}

