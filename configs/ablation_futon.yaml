# FUTON ablations on the occupancy task:
#     scripts/train_occupancy.py --config configs/ablation_futon.yaml \
#         --log-dir logs/ablation-futon
# The settings repeat configs/occupancy.yaml, and the default model is the
# benchmark's: K = 128 components, CP rank 218 and a one-layer MLP decoder
# (131,673 parameters).

data:
  resolution: 256
  subsample: 0.01

train:
  num_epochs: 2000
  log_interval: 100
  eval_interval: 100
  chunk_size: 262144
  seed: 0

models:
  # Bases, at the default size.
  FUTON-cosine:
    class: FUTON
    kwargs:
      basis: [cosine, {num_components: 128, grid_size: 256}]
      combiner: [cp, {rank: 218}]
      decoder: [mlp, {hidden_layers: 1}]
      output_activation: tanh
    train: {lr: 1.0e-2}

  FUTON-lanczos:
    class: FUTON
    kwargs:
      basis: [lanczos, {num_components: 128, radius: 3}]
      combiner: [cp, {rank: 218}]
      decoder: [mlp, {hidden_layers: 1}]
      output_activation: tanh
    train: {lr: 1.0e-2}

  FUTON-sinc:
    class: FUTON
    kwargs:
      basis: [sinc, {num_components: 128, grid_size: 256}]
      combiner: [cp, {rank: 218}]
      decoder: [mlp, {hidden_layers: 1}]
      output_activation: tanh
    train: {lr: 1.0e-2}

  FUTON-triangle:
    class: FUTON
    kwargs:
      basis: [triangle, {num_components: 128}]
      combiner: [cp, {rank: 218}]
      decoder: [mlp, {hidden_layers: 1}]
      output_activation: tanh
    train: {lr: 1.0e-2}

  FUTON-chebyshev:
    class: FUTON
    kwargs:
      basis: [chebyshev, {num_components: 128}]
      combiner: [cp, {rank: 218}]
      decoder: [mlp, {hidden_layers: 1}]
      output_activation: tanh
    train: {lr: 1.0e-2}

  FUTON-legendre:
    class: FUTON
    kwargs:
      basis: [legendre, {num_components: 128}]
      combiner: [cp, {rank: 218}]
      decoder: [mlp, {hidden_layers: 1}]
      output_activation: tanh
    train: {lr: 1.0e-2}

  # Components K against rank R.
  FUTON-cosine-K32-R32:
    class: FUTON
    kwargs:
      basis: [cosine, {num_components: 32, grid_size: 256}]
      combiner: [cp, {rank: 32}]
      decoder: [mlp, {hidden_layers: 1}]
      output_activation: tanh
    train: {lr: 1.0e-2}

