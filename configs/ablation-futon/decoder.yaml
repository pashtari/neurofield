# FUTON ablation on the image task: the decoder. The paper's Eq. (9) ends in a
# linear decoder; the benchmark's one-layer MLP is an extension that spends
# 51,075 of its 194,435 parameters there, 26% of the model. A linear decoder
# frees them for the combiner, so CP rank 302 brings it back to 194,189
# parameters, and the two are compared at that equal size.
#     python scripts/train_image.py --config configs/ablation-futon/decoder.yaml
# The data and training settings repeat configs/image.yaml.

data:
  subsample: 0.1

train:
  num_epochs: 2000
  log_interval: 100
  eval_interval: 100
  seed: 0

models:
  FUTON-lanczos:
    class: FUTON
    kwargs:
      basis: [lanczos, {num_components: [H // 2, W // 2], radius: 3}]
      combiner: [cp, {rank: 224}]
      decoder: [mlp, {hidden_layers: 1}]
      output_activation: tanh
    train: {lr: 3.0e-2}

  FUTON-sinc:
    class: FUTON
    kwargs:
      basis: [sinc, {num_components: [H // 2, W // 2], grid_size: [H, W]}]
      combiner: [cp, {rank: 224}]
      decoder: [mlp, {hidden_layers: 1}]
      output_activation: tanh
    train: {lr: 3.0e-2}

  FUTON-lanczos-linear:  # equal size
    class: FUTON
    kwargs:
      basis: [lanczos, {num_components: [H // 2, W // 2], radius: 3}]
      combiner: [cp, {rank: 302}]
      decoder: linear
      output_activation: tanh
    train: {lr: 3.0e-2}

  FUTON-sinc-linear:  # equal size
    class: FUTON
    kwargs:
      basis: [sinc, {num_components: [H // 2, W // 2], grid_size: [H, W]}]
      combiner: [cp, {rank: 302}]
      decoder: linear
      output_activation: tanh
    train: {lr: 3.0e-2}
