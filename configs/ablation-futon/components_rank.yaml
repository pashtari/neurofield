# FUTON ablation on the occupancy task: components K against CP rank R, both
# over {32, 64, 128, 256}, for the lanczos and sinc bases and the
# benchmark's one-layer MLP decoder.
#     python scripts/train_occupancy.py --config configs/ablation-futon/components_rank.yaml
# The data and training settings repeat configs/occupancy.yaml.

data:
  resolution: 256
  subsample: 0.01

train:
  num_epochs: 2000
  log_interval: 100
  eval_interval: 100
  chunk_size: 262144
  seed: 0

models:
  FUTON-lanczos-K32-R32:
    class: FUTON
    kwargs:
      basis: [lanczos, {num_components: 32, radius: 3}]
      combiner: [cp, {rank: 32}]
      decoder: [mlp, {hidden_layers: 1}]
      output_activation: tanh
    train: {lr: 1.0e-2}

  FUTON-lanczos-K32-R64:
    class: FUTON
    kwargs:
      basis: [lanczos, {num_components: 32, radius: 3}]
      combiner: [cp, {rank: 64}]
      decoder: [mlp, {hidden_layers: 1}]
      output_activation: tanh
    train: {lr: 1.0e-2}

  FUTON-lanczos-K32-R128:
    class: FUTON
    kwargs:
      basis: [lanczos, {num_components: 32, radius: 3}]
      combiner: [cp, {rank: 128}]
      decoder: [mlp, {hidden_layers: 1}]
      output_activation: tanh
    train: {lr: 1.0e-2}

  FUTON-lanczos-K32-R256:
