# FUTON ablations on the occupancy task, self-contained: run it with
#     scripts/train_occupancy.py --config configs/ablation_futon.yaml \
#         --log-dir logs/ablation-futon
# The data and training settings repeat configs/occupancy.yaml, so that the
# reference entries (FUTON-cosine, FUTON-sinc) match the benchmark exactly.
#
# A tensor-ring combiner of rank r has the same parameter count as a CP
# combiner of rank r^2 at equal num_components, so the TR entries below pair
# exactly with the CP ones: r=12 with the reference R=144, r=16 with R=256.

data:
  resolution: 256
  subsample: 0.01

train:
  num_epochs: 2000
  log_interval: 100
  eval_interval: 100
  chunk_size: 262144
  seed: 0

models:
  # Reference: the entries of configs/occupancy.yaml, repeated so that the
  # ablation tables stand on their own.
  FUTON-cosine:
    class: FUTON
    kwargs:
      basis: [cosine, {num_components: 256, grid_size: 256}]
      combiner: [cp, {rank: 144}]
      decoder: [mlp, {hidden_layers: 1}]
      output_activation: tanh
    train: {lr: 1.0e-2}

  FUTON-sinc:
    class: FUTON
    kwargs:
      basis: [sinc, {num_components: 256, grid_size: 256}]
      combiner: [cp, {rank: 144}]
      decoder: [mlp, {hidden_layers: 1}]
      output_activation: tanh
    train: {lr: 1.0e-2}

  # Rank R and components K, a full grid for each basis.
  FUTON-cosine-K64-R64:
    class: FUTON
    kwargs:
      basis: [cosine, {num_components: 64, grid_size: 256}]
      combiner: [cp, {rank: 64}]
      decoder: [mlp, {hidden_layers: 1}]
      output_activation: tanh
    train: {lr: 1.0e-2}

  FUTON-cosine-K64-R128:
    class: FUTON
    kwargs:
      basis: [cosine, {num_components: 64, grid_size: 256}]
      combiner: [cp, {rank: 128}]
      decoder: [mlp, {hidden_layers: 1}]
      output_activation: tanh
    train: {lr: 1.0e-2}

  FUTON-cosine-K64-R256:
    class: FUTON
    kwargs:
      basis: [cosine, {num_components: 64, grid_size: 256}]
      combiner: [cp, {rank: 256}]
      decoder: [mlp, {hidden_layers: 1}]
      output_activation: tanh
    train: {lr: 1.0e-2}

  FUTON-cosine-K64-R512:
    class: FUTON
    kwargs:
      basis: [cosine, {num_components: 64, grid_size: 256}]
      combiner: [cp, {rank: 512}]
      decoder: [mlp, {hidden_layers: 1}]
      output_activation: tanh
    train: {lr: 1.0e-2}

  FUTON-cosine-K128-R64:
    class: FUTON
