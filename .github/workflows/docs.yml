name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "neurofield/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The API pages are built by static analysis, so the package itself
      # (and PyTorch) need not be installed.
      - run: pip install mkdocs-material "mkdocstrings[python]"
      - run: mkdocs build --strict
      - run: mkdocs gh-deploy --force
